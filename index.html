<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cody Trippin</title>
<meta name="theme-color" content="#F2F3F1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cody Trippin">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app. Home = trip list. Trip = sticky header + day strip, day list, fixed bottom tabs.
   Palette: basalt ink/surfaces, tangerine accent (now/next), sea green (navigate). */
:root {
  --bg: #F2F3F1; --surface: #FFFFFF; --surface-2: #E7E9E6; --ink: #171B1A; --muted: #5E6763; --line: #D6DAD6;
  --tangerine: #E8761A; --tangerine-soft: #FCE7D4; --sea: #13706A; --sea-soft: #DCEEEC; --sea-ink: #FFFFFF;
  --warn: #A4400B; --warn-soft: #FBE3D3;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px; --scale: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111413; --surface: #1B1F1E; --surface-2: #252A28; --ink: #EEF1EF; --muted: #9AA4A0; --line: #2F3532;
    --tangerine: #F59A45; --tangerine-soft: #3A2716; --sea: #3FB3A9; --sea-soft: #16302D; --sea-ink: #0B1413;
    --warn: #F7A06A; --warn-soft: #3A2316; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111413; --surface: #1B1F1E; --surface-2: #252A28; --ink: #EEF1EF; --muted: #9AA4A0; --line: #2F3532;
  --tangerine: #F59A45; --tangerine-soft: #3A2716; --sea: #3FB3A9; --sea-soft: #16302D; --sea-ink: #0B1413;
  --warn: #F7A06A; --warn-soft: #3A2316; color-scheme: dark;
}
html.big { --scale: 1.22; }
* { box-sizing: border-box; }
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: calc(16px * var(--scale)); line-height: 1.4; -webkit-text-size-adjust: 100%;
  padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
}
body.home { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--tangerine); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); letter-spacing: .02em; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 10px 16px 6px; }
.top-row { display: flex; align-items: center; gap: 8px; }
.top h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: calc(1.3rem * var(--scale)); letter-spacing: -.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand { font-family: var(--font-display); font-weight: 800; letter-spacing: -.02em; }
.brand span { color: var(--tangerine); }
.top .sub { color: var(--muted); font-size: .85em; display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-width: 40px; height: 40px; padding: 0 10px; display: inline-grid; place-items: center; cursor: pointer; font-weight: 700; text-decoration: none; }
.icon-btn svg { width: 20px; height: 20px; }

/* Day strip */
.days { display: flex; gap: 6px; overflow-x: auto; padding: 6px 16px 8px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 5px 10px; text-align: center; cursor: pointer; min-width: 54px; }
.day b { display: block; font-family: var(--font-display); font-size: 1.15em; line-height: 1.1; }
.day small { color: var(--muted); font-size: .72em; text-transform: uppercase; letter-spacing: .06em; }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day[aria-pressed="true"] small { color: inherit; opacity: .75; }
.day.today:not([aria-pressed="true"]) { border-color: var(--tangerine); border-width: 2px; }

main { padding: 0 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.section-h { margin: 4px 0 0; font-size: .78em; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }

/* Buttons */
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; font-weight: 700; cursor: pointer; }
.btn svg { width: 20px; height: 20px; flex: 0 0 auto; }
.btn.go { background: var(--sea); color: var(--sea-ink); border-color: var(--sea); }
.btn.small { min-height: 38px; padding: 0 11px; font-size: .9em; }
.btn.icon { min-width: 40px; padding: 0 9px; }

/* Day list */
.tl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.row { display: grid; grid-template-columns: 54px 30px 1fr auto; gap: 8px; align-items: center; padding: 11px 12px; cursor: pointer; width: 100%; text-align: left; background: none; border: 0; }
.row .t { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.row .t small { display: block; font-weight: 400; color: var(--muted); font-size: .7em; margin-top: 2px; }
.row .ic { width: 30px; height: 30px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; }
.row .ic svg { width: 17px; height: 17px; }
.row .ti { min-width: 0; }
.row .ti b { display: block; overflow-wrap: anywhere; line-height: 1.2; }
.row .ti span { color: var(--muted); font-size: .85em; }
.row .chev { width: 18px; height: 18px; color: var(--muted); transition: transform .15s; }
.item.open .row .chev { transform: rotate(180deg); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.item.past .row { opacity: .45; }
.item.now { background: var(--tangerine-soft); box-shadow: inset 4px 0 0 var(--tangerine); }
.item.now .row .ic { background: var(--tangerine); color: #fff; }
.item.now .row .t { color: var(--tangerine); }
.chip { font-size: .68em; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; text-transform: uppercase; letter-spacing: .04em; }
.chip.now { background: var(--tangerine); color: #fff; }
.chip.next { background: var(--sea-soft); color: var(--sea); }
.chip.opt { background: var(--tangerine-soft); color: var(--warn); }
.chip.who { background: transparent; border: 1px solid var(--line); }
.detail { padding: 0 12px 14px 12px; display: grid; gap: 10px; }
.gallery { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; }
.gallery img { flex: 0 0 88%; border-radius: 10px; aspect-ratio: 16/10; object-fit: cover; scroll-snap-align: start; background: var(--surface-2); }
.gallery img:only-child { flex-basis: 100%; }
.nophoto { border-radius: 10px; background: var(--surface-2); color: var(--muted); font-size: .85em; padding: 10px 12px; }
.kv { display: grid; grid-template-columns: 76px 1fr; gap: 4px 10px; font-size: .92em; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.warn { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 6px 9px; font-size: .9em; font-weight: 700; }
.note { color: var(--muted); font-size: .9em; }
.empty { padding: 18px 14px; color: var(--muted); text-align: center; }
.banner { background: var(--sea-soft); color: var(--sea); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: .9em; }

/* Bookings */
.cat { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.cat-h { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--ink); color: var(--bg); }
.cat-h svg { width: 20px; height: 20px; }
.cat-h h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.1em; flex: 1; }
.cat-h .count { font-size: .8em; opacity: .75; }
.bk { display: grid; grid-template-columns: 50px 1fr; gap: 10px; padding: 11px 12px; border-top: 1px solid var(--line); }
.bk:first-of-type { border-top: 0; }
.date { text-align: center; border-radius: 10px; background: var(--tangerine-soft); padding: 5px 0; align-self: start; line-height: 1.05; }
.date small { display: block; font-size: .68em; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--warn); }
.date b { display: block; font-family: var(--font-display); font-size: 1.5em; font-weight: 800; }
.bk-main { min-width: 0; display: grid; gap: 4px; }
.bk h3 { margin: 0; font-size: 1em; line-height: 1.2; }
.bk .when { font-weight: 700; font-size: .9em; }
.bk .when span { color: var(--muted); font-weight: 400; }
.bk .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: .88em; }
.ref { background: var(--surface-2); padding: 2px 7px; border-radius: 6px; border: 0; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-size: .95em; overflow-wrap: anywhere; text-align: left; }
.ref svg { width: 14px; height: 14px; color: var(--muted); flex: 0 0 auto; }
.pay.due { color: var(--warn); font-weight: 700; }
.pay.ok { color: var(--sea); font-weight: 700; }
.bk .actions { margin-top: 2px; }

/* Lists & info */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.li { display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li input { width: 24px; height: 24px; accent-color: var(--sea); flex: 0 0 auto; margin: 0; }
.li label, .li .txt { flex: 1; min-width: 0; }
.li small { display: block; color: var(--muted); }
.li.done label { text-decoration: line-through; color: var(--muted); }
.phone { font-size: 1.2em; font-weight: 700; font-variant-numeric: tabular-nums; text-decoration: none; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tangerine); flex: 0 0 auto; margin-top: 7px; }

/* Home: trip list */
.hero { padding: 22px 16px 8px; }
.hero h1 { margin: 0; font-size: calc(2rem * var(--scale)); line-height: 1; }
.hero p { margin: 6px 0 0; color: var(--muted); }
.trip { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.trip h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.45em; line-height: 1.05; letter-spacing: -.01em; }
.trip h2 { display: flex; align-items: center; gap: 8px; }
.trip-icon { font-size: 1.1em; line-height: 1; flex: 0 0 auto; }
.trip .dates { font-weight: 700; }
.trip .who { color: var(--muted); font-size: .85em; grid-column: 1 / -1; }
.trip .status { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-size: .8em; font-weight: 700; color: var(--sea); }
.trip .status b { display: block; font-family: var(--font-display); font-size: 1.6em; color: var(--ink); }
.trip.past { opacity: .6; }
.add { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 14px; }
.add label { font-weight: 700; }
.add .row2 { display: flex; gap: 8px; }
.add input, .gate input { font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; width: 100%; flex: 1 1 0; }
.err { color: var(--warn); min-height: 1.2em; font-size: .9em; }

/* Bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tab { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: .75em; font-weight: 700; color: var(--muted); cursor: pointer; border-radius: 10px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--ink); background: var(--surface-2); }

/* Gate */
.gate { max-width: 360px; margin: 16vh auto 0; padding: 0 16px; display: grid; gap: 12px; text-align: center; }
.gate h1 { margin: 0; font-size: 2.2rem; }
.gate input { font-size: 1.6rem; text-align: center; letter-spacing: .3em; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 99px; font-size: .9em; z-index: 9; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .item.open .detail { animation: open .16s ease-out; } @keyframes open { from { opacity: .3; } } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- config ---------- */
const CONFIG = {
  api: 'https://script.google.com/macros/s/AKfycbzGT9XP-GYVCAEH7_k6XGaXVdv6rMG65L9_DfapVw8mgeZ_ZZx9Ryb9cJy3B3oM_EnjZA/exec',
  knownTrips: ['jeju-2026'], // fallback list if the backend can't look a code up by itself
  naverAppName: 'https://mclala-k.github.io/cody-trippin',
  tzOffsetMin: 9 * 60 // trip wall clock (Asia/Seoul); per-trip timezones can come later
};
const store = {
  get(k, d) { try { const v = localStorage.getItem('ct:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ct:' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- icons ---------- */
const P = {
  Flight: '<path d="M2 16l20-7-3-2-7 2-5-5-2 1 3 6-4 1-2-1-1 1 3 3z"/>',
  Hotel: '<path d="M3 20V6m0 8h18v6M3 14v-3a2 2 0 012-2h4v5m4 0V9h5a3 3 0 013 3v2"/>',
  Car: '<path d="M5 16h14M6 16v2m12-2v2M4 16l1.5-6A2 2 0 017.4 8.5h9.2a2 2 0 011.9 1.5L20 16M7.5 13h.01M16.5 13h.01"/>',
  Nature: '<path d="M12 21v-5m0 0l-6-1 6-11 6 11-6 1z"/>',
  Food: '<path d="M5 3v8a3 3 0 006 0V3M8 3v18M17 3c-2 2-2 6 0 8v10"/>',
  Market: '<path d="M4 9l2-5h12l2 5M4 9h16v11H4zM4 9a2.7 2.7 0 005.3 0 2.7 2.7 0 005.4 0A2.7 2.7 0 0020 9M10 20v-5h4v5"/>',
  Activity: '<circle cx="12" cy="13" r="7"/><path d="M12 6V3m-2 1h4"/>',
  Drive: '<path d="M3 17c4 0 4-8 9-8s5 8 9 8M12 3v2m0 14v2"/>',
  nav: '<path d="M3 11l18-8-8 18-2-8z"/>',
  phone: '<path d="M5 3h4l2 5-3 2a12 12 0 006 6l2-3 5 2v4a2 2 0 01-2 2A18 18 0 013 5a2 2 0 012-2z"/>',
  doc: '<path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6m-6 4h6"/>',
  today: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4m8-4v4"/>',
  book: '<path d="M4 7h16v12H4zM9 7V5h6v2M4 12h16"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.01"/>',
  refresh: '<path d="M20 12a8 8 0 11-3-6.2M20 4v5h-5"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V5a1 1 0 011-1h11"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  chev: '<path d="M6 9l6 6 6-6"/>'
};
P.Activities = P.Activity;
const icon = (n, cls) => '<svg' + (cls ? ' class="' + cls + '"' : '') + ' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (P[n] || P.Activity) + '</svg>';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- time (trip times are wall clock at the destination) ---------- */
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function toMs(date, hm) {
  const [y, m, d] = String(date).split('-').map(Number);
  const [h, mi] = String(hm || '00:00').split(':').map(Number);
  return Date.UTC(y, m - 1, d, h || 0, mi || 0) - CONFIG.tzOffsetMin * 60000;
}
function localParts(ms) {
  const d = new Date(ms + CONFIG.tzOffsetMin * 60000), p = (n) => String(n).padStart(2, '0');
  return { date: d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()), hm: p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) };
}
function dparts(date) {
  const [y, m, d] = String(date).split('-').map(Number);
  return { y, m, d, w: DOW[new Date(Date.UTC(y, m - 1, d)).getUTCDay()], mon: MON[m - 1] };
}
const dayLabel = (date) => { const p = dparts(date); return p.w + ' ' + p.d + ' ' + p.mon; };
function rangeLabel(a, b) {
  if (!a) return '';
  const x = dparts(a), y = b ? dparts(b) : null;
  if (!y) return x.d + ' ' + x.mon + ' ' + x.y;
  if (x.y === y.y && x.m === y.m) return x.d + '–' + y.d + ' ' + y.mon + ' ' + y.y;
  if (x.y === y.y) return x.d + ' ' + x.mon + ' – ' + y.d + ' ' + y.mon + ' ' + y.y;
  return x.d + ' ' + x.mon + ' ' + x.y + ' – ' + y.d + ' ' + y.mon + ' ' + y.y;
}
function splitDT(s) { const [d, t] = String(s || '').split(' '); return [d || '', t || '']; }
function dur(min) {
  min = Math.round(min);
  if (min < 60) return min + ' min';
  const h = Math.floor(min / 60), m = min % 60;
  if (h >= 48) return Math.round(h / 24) + ' days';
  return h + ' h' + (m ? ' ' + m + ' min' : '');
}
const nights = (a, b) => Math.round((toMs(b, '12:00') - toMs(a, '12:00')) / 864e5);

/* ---------- state ---------- */
const S = { tripId: null, data: null, events: [], days: [], tab: 'today', day: null, open: new Set(), weather: {}, bookings: {} };
const now = () => Date.now();
const live = (e) => e.status !== 'Alternative';
// trips this phone has unlocked: { id: { code, summary } }
const myTrips = () => store.get('trips', {});
const saveTrips = (t) => store.set('trips', t);

/* ---------- API ---------- */
async function api(params) {
  const q = Object.entries(params).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
  const r = await fetch(CONFIG.api + '?' + q, { redirect: 'follow' });
  return r.json();
}
function summaryFrom(id, data) {
  const t = data.trip || {};
  return { id, tripName: t.tripName || id, destination: t.destination || '', start: t.start || '', end: t.end || '', travellers: t.travellers || '', icon: t.icon || '' };
}
/** Unlock with a code: returns list of trip summaries (new backend), or probes known trips (old backend). */
async function unlock(code) {
  const found = [];
  try {
    const j = await api({ action: 'unlock', code });
    if (j.ok && j.trips) return j.trips;
    if (j.error === 'bad_passcode') return [];
  } catch (e) { throw e; }
  for (const id of CONFIG.knownTrips) {
    const j = await api({ trip: id, code });
    if (j.ok) { store.set('data:' + id, j); found.push(summaryFrom(id, j)); }
  }
  return found;
}

/* ---------- data -> events ---------- */
function build(data) {
  const ev = [];
  const num = (v) => (v === '' || v == null || isNaN(+v)) ? null : +v;
  (data.itinerary || []).forEach((r, i) => {
    if (!r.date || !r.title) return;
    ev.push({ key: 'i' + i, type: r.type || 'Activity', title: r.title, date: r.date, start: r.start || '', end: r.end || '',
      label: r.timeLabel || '', who: r.who || 'All', area: r.area || '', address: r.address || '', lat: num(r.lat), lng: num(r.lng),
      nav: r.naverLink || '', driveMin: num(r.driveMin), photos: photoList(r), hours: r.hoursPrice || '',
      notes: r.notes || '', status: r.status || 'Confirmed', bookingId: r.bookingId || '' });
  });
  (data.bookings || []).forEach((b) => {
    const [sd, st] = splitDT(b.start), [ed, et] = splitDT(b.end);
    const base = { bookingId: b.id, who: 'All', status: 'Booked', address: b.address || '', lat: num(b.lat), lng: num(b.lng),
      nav: b.naverLink || '', photos: photoList(b), phone: b.phone || '', notes: b.remarks || '' };
    const add = (o) => ev.push(Object.assign({}, base, o));
    if (b.category === 'Flight') {
      add({ key: b.id, type: 'Flight', title: b.title, date: sd, start: st, end: ed === sd ? et : '', sub: (b.fromDepTerminal || '') + (b.toArrTerminal ? ' → ' + b.toArrTerminal : '') + ' · lands ' + et });
    } else if (b.category === 'Hotel') {
      add({ key: b.id + 'a', type: 'Hotel', title: 'Check in · ' + b.title, place: b.title, date: sd, start: st, end: '', label: 'from' });
      add({ key: b.id + 'b', type: 'Hotel', title: 'Check out · ' + b.title, place: b.title, date: ed, start: et, end: '', label: 'by' });
    } else if (b.category === 'Car') {
      const carPlace = b.title.split(' · ')[0] + (b.fromDepTerminal ? ' ' + b.fromDepTerminal : '');
      add({ key: b.id + 'a', type: 'Car', title: 'Pick up car', place: carPlace, sub: b.title + (b.fromDepTerminal ? ' · ' + b.fromDepTerminal : ''), date: sd, start: st, end: '' });
      add({ key: b.id + 'b', type: 'Car', title: 'Return car', place: b.title.split(' · ')[0] + (b.toArrTerminal ? ' ' + b.toArrTerminal : ''), sub: b.title + (b.toArrTerminal ? ' · ' + b.toArrTerminal : ''), date: ed, start: et, end: '' });
    } else if (sd) {
      add({ key: b.id, type: 'Activity', title: b.title, date: sd, start: st, end: ed === sd ? et : '' });
    }
  });
  // A step with no end time lasts until the next step starts (max 3 h), so "now" stays highlighted while you do it.
  ev.sort((a, b) => toMs(a.date, a.start) - toMs(b.date, b.start) || (a.status === 'Alternative') - (b.status === 'Alternative'));
  ev.forEach((e) => { e.t0 = toMs(e.date, e.start || '00:00'); });
  ev.forEach((e, i) => {
    if (e.end) { e.t1 = toMs(e.date, e.end); return; }
    const nxt = ev.slice(i + 1).find((x) => live(x) && x.t0 > e.t0);
    e.t1 = Math.min(nxt ? nxt.t0 : e.t0 + 3 * 36e5, e.t0 + 3 * 36e5);
  });
  S.events = ev;
  S.bookings = Object.fromEntries((data.bookings || []).map((b) => [b.id, b]));
  const t = data.trip || {}, start = t.start || (ev[0] && ev[0].date), end = t.end || (ev.length && ev[ev.length - 1].date);
  const days = [];
  if (start && end) for (let ms = toMs(start, '12:00'); ms <= toMs(end, '12:00'); ms += 864e5) days.push(localParts(ms).date);
  S.days = days;
}
function photoList(r) {
  return [r.photoUrl || r.photoLink, r.photo2, r.photo3].filter(Boolean).map((u) => {
    const m = String(u).match(/(?:\/d\/|[?&]id=)([A-Za-z0-9_-]{20,})/);
    return /(drive|docs)\.google\.com/.test(u) && m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w800' : u;
  });
}
function nowNext() {
  const n = now();
  const cur = S.events.filter((e) => live(e) && e.t0 <= n && n < e.t1).pop() || null;
  const next = S.events.find((e) => live(e) && e.t0 > n) || null;
  return { cur, next };
}

/* ---------- Naver Map: open the app searching the place's Korean name ----------
   Naver's own search lands on the real listing (reviews, photos) when the name is
   unique, or lists the matches so you can tap the right one. The Korean name comes
   from the sheet's "Naver link" (map.naver.com/p/search/<name>), else the title. */
function naverQuery(e) {
  const m = (e.nav || '').split('/search/')[1];
  if (m) { const raw = m.split(/[?#]/)[0]; try { return decodeURIComponent(raw).trim(); } catch (_) { return raw.trim(); } }
  return String(e.place || e.title || '').trim();
}
function naverHref(e) {
  const q = naverQuery(e);
  if (!q) return '';
  return 'nmap://search?query=' + encodeURIComponent(q) + '&appname=' + encodeURIComponent(CONFIG.naverAppName);
}
function naverWeb(e) {
  const q = naverQuery(e);
  return q ? 'https://map.naver.com/p/search/' + encodeURIComponent(q) : '';
}
function navBtn(e, label) {
  const href = naverHref(e);
  if (!href) return '';
  return '<a class="btn go small" href="' + esc(href) + '" data-web="' + esc(naverWeb(e)) + '">' + icon('nav') + (label || 'Navigate') + '</a>';
}
function callBtn(phone, iconOnly) {
  if (!phone) return '';
  return '<a class="btn small' + (iconOnly ? ' icon' : '') + '" href="tel:' + esc(String(phone).replace(/\s/g, '')) + '" aria-label="Call ' + esc(phone) + '">' + icon('phone') + (iconOnly ? '' : esc(phone)) + '</a>';
}
function pdfBtn(b, iconOnly) {
  if (!b || !b.bookingPdfLink) return '';
  return '<a class="btn small' + (iconOnly ? ' icon' : '') + '" href="' + esc(b.bookingPdfLink) + '" target="_blank" rel="noopener" aria-label="Booking PDF">' + icon('doc') + (iconOnly ? '' : 'Booking PDF') + '</a>';
}

/* ---------- weather (Open-Meteo, free; only within ~16 days) ---------- */
const WMO = (c) => c == null ? '' : c === 0 ? 'Clear' : c <= 2 ? 'Partly cloudy' : c === 3 ? 'Cloudy' : c <= 48 ? 'Fog' : c <= 57 ? 'Drizzle' : c <= 67 ? 'Rain' : c <= 77 ? 'Snow' : c <= 82 ? 'Showers' : c <= 86 ? 'Snow showers' : 'Thunderstorm';
async function loadWeather() {
  const today = localParts(now()).date;
  const want = S.days.filter((d) => d >= today && (toMs(d, '00:00') - now()) < 15 * 864e5 && !S.weather[d]);
  for (const d of want) {
    const e = S.events.find((x) => x.date === d && x.lat != null) || S.events.filter((x) => x.date < d && x.lat != null).pop();
    if (!e) continue;
    try {
      const u = 'https://api.open-meteo.com/v1/forecast?latitude=' + e.lat.toFixed(3) + '&longitude=' + e.lng.toFixed(3) +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=Asia%2FSeoul&start_date=' + d + '&end_date=' + d;
      const j = await (await fetch(u)).json();
      if (j.daily) S.weather[d] = { code: j.daily.weather_code[0], hi: j.daily.temperature_2m_max[0], lo: j.daily.temperature_2m_min[0], rain: j.daily.precipitation_probability_max[0], wind: j.daily.wind_speed_10m_max[0] };
    } catch (err) { /* offline: no weather */ }
  }
  if (want.length) { store.set('weather:' + S.tripId, S.weather); renderHeaderOnly(); }
}
function weatherText(d) {
  const w = S.weather[d];
  if (!w) return '';
  return WMO(w.code) + ' · ' + Math.round(w.lo) + '–' + Math.round(w.hi) + '°C · wind ' + Math.round(w.wind) + ' km/h' + (w.rain != null ? ' · rain ' + w.rain + '%' : '');
}

/* ---------- HOME: trip list ---------- */
function homeView(msg) {
  document.body.classList.add('home');
  const trips = Object.values(myTrips()).map((t) => t.summary).filter(Boolean)
    .sort((a, b) => (a.start || '').localeCompare(b.start || ''));
  const n = now(), todayD = localParts(n).date;
  const upcoming = trips.filter((t) => !t.end || t.end >= todayD), past = trips.filter((t) => t.end && t.end < todayD);
  const card = (t) => {
    let status = '';
    if (t.start && todayD < t.start) { const d = Math.ceil((toMs(t.start, '00:00') - n) / 864e5); status = '<b class="num">' + d + '</b>' + (d === 1 ? 'day to go' : 'days to go'); }
    else if (t.end && todayD <= t.end) status = '<b>Now</b>on the trip';
    else status = 'Done';
    return '<a class="trip' + (t.end && t.end < todayD ? ' past' : '') + '" href="#' + esc(t.id) + '"><h2>' +
      (t.icon ? '<span class="trip-icon" aria-hidden="true">' + esc(t.icon) + '</span>' : '') + esc(t.destination || t.tripName) + '</h2>' +
      '<span class="status">' + status + '</span><span class="dates num">' + esc(rangeLabel(t.start, t.end)) + '</span>' +
      (t.travellers ? '<span class="who">' + esc(t.travellers) + '</span>' : '') + '</a>';
  };
  document.getElementById('app').innerHTML =
    '<header class="hero"><h1 class="brand">Cody <span>Trippin</span></h1><p>Your trips with Cody</p></header><main>' +
    (upcoming.length ? '<h2 class="section-h"><span>Upcoming</span></h2>' + upcoming.map(card).join('') : '') +
    addForm(msg, !trips.length) +
    (past.length ? '<h2 class="section-h"><span>Past trips</span></h2>' + past.map(card).join('') : '') + '</main>';
  bindAdd();
}
function addForm(msg, first) {
  return '<form class="add" id="add"><label for="code">' + (first ? 'Enter your trip passcode' : 'Add another trip') + '</label>' +
    '<div class="row2"><input id="code" inputmode="numeric" autocomplete="off" placeholder="Passcode" required>' +
    '<button class="btn go" type="submit">Open</button></div><div class="err" id="err">' + esc(msg || '') + '</div></form>';
}
function bindAdd() {
  const f = document.getElementById('add');
  if (!f) return;
  f.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const code = document.getElementById('code').value.trim(), err = document.getElementById('err');
    err.textContent = 'Checking…';
    try {
      const found = await unlock(code);
      if (!found.length) { err.textContent = 'That passcode doesn’t match a trip. Check with Cody.'; return; }
      const t = myTrips();
      found.forEach((s) => { t[s.id] = { code, summary: s }; });
      saveTrips(t);
      if (found.length === 1) location.hash = found[0].id; else homeView();
    } catch (e) { err.textContent = 'No connection. Connect to the internet to add a trip.'; }
  });
}

function warnOrText(t) {
  const parts = String(t).split(' · ');

  return w.map((p) => '<div class="warn">' + esc(p) + '</div>').join('') + (rest.length ? '<div class="note">' + esc(rest.join(' · ')) + '</div>' : '');

function todayView() {
  const n = now(), first = S.events[0];
  const list = S.events.filter((e) => e.date === S.day);
  const { cur, next } = nowNext();
  let banner = '';
  if (first && n < first.t0 && S.day === S.days[0]) banner = '<div class="banner">Trip starts in ' + dur((first.t0 - n) / 60000) + '</div>';
  if (!list.length) return '<main>' + banner + '<div class="tl"><div class="empty">Nothing planned yet for ' + dayLabel(S.day) + '.</div></div></main>';
  return '<main>' + banner + '<div class="tl" id="tl">' + list.map((e) => itemHTML(e, cur, next, n)).join('') + '</div></main>';
}
function itemHTML(e, cur, next, n) {
  const isNow = cur === e, isNext = next === e;
  const past = !isNow && e.t1 <= n;
  const open = S.open.has(e.key);
  const lab = e.label && !/^\d{1,2}:\d{2}/.test(e.label) && e.label !== e.start ? e.label : '';
  const chips = (isNow ? '<span class="chip now">Now</span>' : '') +
    (isNext && !isNow ? '<span class="chip next">Next · ' + esc(dur((e.t0 - n) / 60000)) + '</span>' : '') +
    (e.status === 'Optional' ? '<span class="chip opt">Optional</span>' : e.status === 'Alternative' ? '<span class="chip opt">Backup</span>' : '') +
    (e.who && e.who !== 'All' ? '<span class="chip who">' + esc(e.who) + '</span>' : '');
  return '<div class="item' + (past ? ' past' : '') + (isNow ? ' now' : '') + (open ? ' open' : '') + '" data-key="' + e.key + '">' +
    '<button class="row" data-open="' + e.key + '" aria-expanded="' + open + '">' +
    '<span class="t">' + esc(e.start || '–') + (lab ? '<small>' + esc(lab) + '</small>' : '') + '</span>' +
    '<span class="ic">' + icon(e.type) + '</span>' +
    '<span class="ti"><b>' + esc(e.title) + '</b><span>' + esc(e.sub || e.area || '') + (e.driveMin ? ' · ' + e.driveMin + ' min drive' : '') + '</span>' +
    (chips ? '<span class="chips" style="justify-content:flex-start;margin-top:4px">' + chips + '</span>' : '') + '</span>' +
    icon('chev', 'chev') + '</button>' + (open ? detail(e) : '') + '</div>';
}
function detail(e) {
  const b = e.bookingId && S.bookings[e.bookingId];
  const kv = [];
  if (e.start) kv.push(['Time', esc(e.start) + (e.end ? '–' + esc(e.end) : '') + (e.label && !/^(\d|from$|by$)/.test(e.label) ? ' · ' + esc(e.label) : '')]);
  if (e.hours) kv.push(['Hours', esc(e.hours)]);
  if (e.address) kv.push(['Address', esc(e.address)]);
  if (b) kv.push(['Booking', '<button class="ref mono" data-copy="' + esc(b.refNo) + '">' + esc(b.refNo) + icon('copy') + '</button>']);
  if (b && b.amount) kv.push(['Payment', esc(b.paid) + ' · ' + esc(b.amount)]);
  const photos = e.photos && e.photos.length
    ? '<div class="gallery">' + e.photos.map((u) => '<img src="' + esc(u) + '" alt="' + esc(e.title) + '" loading="lazy" referrerpolicy="no-referrer">').join('') + '</div>'
    : '';
  return '<div class="detail">' + photos +
    '<dl class="kv">' + kv.map((p) => '<dt>' + p[0] + '</dt><dd>' + p[1] + '</dd>').join('') + '</dl>' +

function bookingsView() {

function bookingHTML(b, cat) {

/* ---------- interactions ---------- */
function toast(msg) {

  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 1800);

function toggleItem(key) {

  if (!el || !e) return;
  const btn = el.querySelector('.row');
  if (S.open.has(key)) { S.open.delete(key); el.classList.remove('open'); const d = el.querySelector('.detail'); if (d) d.remove(); btn.setAttribute('aria-expanded', 'false'); }
  else { S.open.add(key); el.classList.add('open'); el.insertAdjacentHTML('beforeend', detail(e)); btn.setAttribute('aria-expanded', 'true'); }
}
document.addEventListener('click', async (ev) => {
  const nav = ev.target.closest('a[href^="nmap://"]');
  if (nav) { // if Naver Map isn't installed, fall back to the website
    const web = nav.dataset.web;
    const t = setTimeout(() => { if (!document.hidden && web) location.href = web; }, 1600);
    document.addEventListener('visibilitychange', () => clearTimeout(t), { once: true });
    return;
  }
  const el = ev.target.closest('[data-tab],[data-day],[data-open],[data-copy],#big,#refresh');
  if (!el) return;
  if (el.dataset.tab) { S.tab = el.dataset.tab; store.set('tab', S.tab); render(); window.scrollTo(0, 0); }
  else if (el.dataset.day) { S.day = el.dataset.day; S.open.clear(); render(); window.scrollTo(0, 0); }
  else if (el.dataset.open) { toggleItem(el.dataset.open); }
  else if (el.dataset.copy != null) {
    ev.stopPropagation();
    try { await navigator.clipboard.writeText(el.dataset.copy); toast('Copied ' + el.dataset.copy); } catch (e) { toast(el.dataset.copy); }
  } else if (el.id === 'big') { const on = document.documentElement.classList.toggle('big'); store.set('big', on); render(true); }
  else if (el.id === 'refresh') { await loadTrip(S.tripId, true); }
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.dataset && t.dataset.tick) {
    const k = 'ticks:' + S.tripId, ticks = store.get(k, {}); ticks[t.dataset.tick] = t.checked; store.set(k, ticks);
    t.closest('.li').classList.toggle('done', t.checked);
  }
});

/* ---------- loading ---------- */
async function loadTrip(id, manual) {
  const entry = myTrips()[id];
  if (!entry) { location.hash = ''; return; }
  const fresh = S.tripId !== id;
  S.tripId = id;
  if (fresh) {
    S.open.clear(); S.day = null; S.tab = store.get('tab', 'today');
    S.weather = store.get('weather:' + id, {});
    const cached = store.get('data:' + id, null);
    if (cached) accept(cached);
    else document.getElementById('app').innerHTML = '<div class="gate"><p>Loading trip…</p></div>';
  }
  try {
    const j = await api({ trip: id, code: entry.code, fresh: manual ? 1 : '' });
    if (j.ok) {
      store.set('data:' + id, j);
      const t = myTrips(); if (t[id]) { t[id].summary = summaryFrom(id, j); saveTrips(t); }
      if (S.tripId === id) { accept(j, !fresh); if (manual) toast('Up to date'); loadWeather(); }
    } else if (j.error === 'bad_passcode') {
      const t = myTrips(); delete t[id]; saveTrips(t); store.set('data:' + id, null);
      location.hash = ''; homeView('The passcode for that trip has changed. Ask Cody for the new one.');
    } else if (manual) toast('The sheet could not be read just now');
  } catch (e) { if (manual || !S.data) toast('No signal. Showing the saved copy.'); }
}
function accept(data, keepScroll) {
  S.data = data; build(data);
  if (!S.day || !S.days.includes(S.day)) pickDefaultDay();
  render(keepScroll);
}
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id && myTrips()[id]) loadTrip(id);
  else { S.tripId = null; S.data = null; homeView(); window.scrollTo(0, 0); }
}
function migrateOld() { // phones that opened the first version (/jeju) already have the Jeju passcode saved
  try {
    const code = JSON.parse(localStorage.getItem('tv:jeju-2026:code') || 'null');
    const data = JSON.parse(localStorage.getItem('tv:jeju-2026:data') || 'null');
    const t = myTrips();
    if (code && !t['jeju-2026']) { t['jeju-2026'] = { code, summary: data ? summaryFrom('jeju-2026', data) : { id: 'jeju-2026', tripName: 'Jeju' } }; saveTrips(t); if (data) store.set('data:jeju-2026', data); }
  } catch (e) {}
}
function boot() {
  if (store.get('big', false)) document.documentElement.classList.add('big');
  migrateOld();
  window.addEventListener('hashchange', route);
  route();
  setInterval(() => { if (S.data && S.tab === 'today') render(true); }, 60000); // keep Now/Next current
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.tripId) loadTrip(S.tripId); });
}
boot();
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
</script>
