<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cody Trippin</title>
<meta name="theme-color" content="#F2F3F1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cody Trippin">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app. Home = trip list. Trip = sticky header + day strip, day list, fixed bottom tabs.
   Palette: basalt ink/surfaces, tangerine accent (now/next), sea green (navigate). */
:root {
  --bg: #F2F3F1; --surface: #FFFFFF; --surface-2: #E7E9E6; --ink: #171B1A; --muted: #5E6763; --line: #D6DAD6;
  --tangerine: #E8761A; --tangerine-soft: #FCE7D4; --sea: #13706A; --sea-soft: #DCEEEC; --sea-ink: #FFFFFF;
  --warn: #A4400B; --warn-soft: #FBE3D3;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px; --scale: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111413; --surface: #1B1F1E; --surface-2: #252A28; --ink: #EEF1EF; --muted: #9AA4A0; --line: #2F3532;
    --tangerine: #F59A45; --tangerine-soft: #3A2716; --sea: #3FB3A9; --sea-soft: #16302D; --sea-ink: #0B1413;
    --warn: #F7A06A; --warn-soft: #3A2316; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111413; --surface: #1B1F1E; --surface-2: #252A28; --ink: #EEF1EF; --muted: #9AA4A0; --line: #2F3532;
  --tangerine: #F59A45; --tangerine-soft: #3A2716; --sea: #3FB3A9; --sea-soft: #16302D; --sea-ink: #0B1413;
  --warn: #F7A06A; --warn-soft: #3A2316; color-scheme: dark;
}
html.big { --scale: 1.22; }
* { box-sizing: border-box; }
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: calc(16px * var(--scale)); line-height: 1.4; -webkit-text-size-adjust: 100%;
  padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
}
body.home { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--tangerine); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--font-mono); letter-spacing: .02em; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 10px 16px 6px; }
.top-row { display: flex; align-items: center; gap: 8px; }
.top h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: calc(1.3rem * var(--scale)); letter-spacing: -.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand { font-family: var(--font-display); font-weight: 800; letter-spacing: -.02em; }
.brand span { color: var(--tangerine); }
.top .sub { color: var(--muted); font-size: .85em; display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-width: 40px; height: 40px; padding: 0 10px; display: inline-grid; place-items: center; cursor: pointer; font-weight: 700; text-decoration: none; }
.icon-btn svg { width: 20px; height: 20px; }

/* Day strip */
.days { display: flex; gap: 6px; overflow-x: auto; padding: 6px 16px 8px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 5px 10px; text-align: center; cursor: pointer; min-width: 54px; }
.day b { display: block; font-family: var(--font-display); font-size: 1.15em; line-height: 1.1; }
.day small { color: var(--muted); font-size: .72em; text-transform: uppercase; letter-spacing: .06em; }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day[aria-pressed="true"] small { color: inherit; opacity: .75; }
.day.today:not([aria-pressed="true"]) { border-color: var(--tangerine); border-width: 2px; }

main { padding: 0 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.section-h { margin: 4px 0 0; font-size: .78em; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }

/* Buttons */
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; font-weight: 700; cursor: pointer; }
.btn svg { width: 20px; height: 20px; flex: 0 0 auto; }
.btn.go { background: var(--sea); color: var(--sea-ink); border-color: var(--sea); }
.btn.small { min-height: 38px; padding: 0 11px; font-size: .9em; }
.btn.icon { min-width: 40px; padding: 0 9px; }

/* Day list */
.tl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.row { display: grid; grid-template-columns: 4.1em 30px 1fr auto; gap: 8px; align-items: center; padding: 11px 12px; cursor: pointer; width: 100%; text-align: left; background: none; border: 0; }
.row .t { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.row .t small { display: block; white-space: nowrap; font-weight: 400; color: var(--muted); font-size: .7em; margin-top: 2px; }
.row .ic { width: 30px; height: 30px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; }
.row .ic svg { width: 17px; height: 17px; }
/* Category colours for the type icon (grey is kept for travel steps and the ALT/OPT tag) */
:root { --nat-bg: #DDF0E0; --nat: #2E7D45; --food-bg: #FCE7D4; --food: #A4400B; --att-bg: #E8E2F8; --att: #5B45A8;
  --act-bg: #DCEBFA; --act: #1F5FA8; --mkt-bg: #F8E1EC; --mkt: #A3346C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --nat-bg: #17321F; --nat: #7FD39A; --food-bg: #3A2716; --food: #F7A06A;
  --att-bg: #2A2342; --att: #B9A8F2; --act-bg: #16283D; --act: #8DBDF2; --mkt-bg: #3A1B2A; --mkt: #F09BC4; } }
:root[data-theme="dark"] { --nat-bg: #17321F; --nat: #7FD39A; --food-bg: #3A2716; --food: #F7A06A;
  --att-bg: #2A2342; --att: #B9A8F2; --act-bg: #16283D; --act: #8DBDF2; --mkt-bg: #3A1B2A; --mkt: #F09BC4; }
.row .ic.t-nature { background: var(--nat-bg); color: var(--nat); }
.row .ic.t-food { background: var(--food-bg); color: var(--food); }
.row .ic.t-attraction { background: var(--att-bg); color: var(--att); }
.row .ic.t-activity, .row .ic.t-activities { background: var(--act-bg); color: var(--act); }
.row .ic.t-market, .row .ic.t-shop { background: var(--mkt-bg); color: var(--mkt); }
/* ALT / OPT tag right before the title */
.tag { display: inline-block; font-size: .66em; font-weight: 700; letter-spacing: .05em; padding: 2px 5px; margin-right: 6px; border-radius: 5px;
  background: var(--surface-2); color: var(--muted); vertical-align: 2px; line-height: 1.2; }
.row .t .tag { margin: 0 0 2px; font-size: .78em; vertical-align: 0; }
.row .ti { min-width: 0; }
.row .ti b { display: block; overflow-wrap: anywhere; line-height: 1.2; }
.row .ti span { color: var(--muted); font-size: .85em; }
.row .chev { width: 18px; height: 18px; color: var(--muted); transition: transform .38s cubic-bezier(.22, 1, .36, 1); }
.item.open .row .chev { transform: rotate(180deg); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.item.past .row { opacity: .45; }
/* Alternatives & optionals sit indented under the main plan, with a thin guide line */
.item.alt .row { padding-left: 36px; position: relative; }
.item.alt .row::before { content: ''; position: absolute; left: 18px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--line); }
.item.alt .detail { padding-left: 36px; }
.item.now { background: var(--tangerine-soft); box-shadow: inset 4px 0 0 var(--tangerine); }
.item.now .row .ic { background: var(--tangerine); color: #fff; }
.item.now .row .t { color: var(--tangerine); }
.chip { font-size: .68em; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; text-transform: uppercase; letter-spacing: .04em; }
.chip.now { background: var(--tangerine); color: #fff; }
.chip.next { background: var(--sea-soft); color: var(--sea); }
.chip.opt { background: var(--tangerine-soft); color: var(--warn); }
.chip.who { background: transparent; border: 1px solid var(--line); }
.detail { padding: 0 12px 14px 12px; display: grid; gap: 10px; }
.carousel { position: relative; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.carousel .track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.carousel .track::-webkit-scrollbar { display: none; }
.carousel .slide { flex: 0 0 100%; position: relative; aspect-ratio: 16/9; scroll-snap-align: start; scroll-snap-stop: always; }
.carousel .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
.carousel .src { position: absolute; left: 6px; bottom: 6px; max-width: 68%; padding: 2px 7px; border-radius: 99px; background: rgba(0, 0, 0, .55); color: #fff;
  font-size: .62em; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.carousel .dots { position: absolute; right: 8px; bottom: 9px; display: flex; gap: 4px; pointer-events: none; }
.carousel .dots i { width: 5px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .55); box-shadow: 0 0 2px rgba(0, 0, 0, .4); transition: width .15s, background .15s; }
.carousel .dots i.on { width: 14px; background: #fff; }
.nophoto { border-radius: 10px; background: var(--surface-2); color: var(--muted); font-size: .85em; padding: 10px 12px; }
.kv { display: grid; grid-template-columns: 76px 1fr; gap: 4px 10px; font-size: .92em; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.warn { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 6px 9px; font-size: .9em; font-weight: 700; }
.note { color: var(--muted); font-size: .9em; }
.empty { padding: 18px 14px; color: var(--muted); text-align: center; }
.banner { background: var(--sea-soft); color: var(--sea); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: .9em; }

/* Bookings */
.cat { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.cat-h { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--ink); color: var(--bg); }
.cat-h svg { width: 20px; height: 20px; }
.cat-h h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.1em; flex: 1; }
.cat-h .count { font-size: .8em; opacity: .75; }
.bk { display: grid; grid-template-columns: 50px 1fr; gap: 10px; padding: 11px 12px; border-top: 1px solid var(--line); }
.bk:first-of-type { border-top: 0; }
.date { text-align: center; border-radius: 10px; background: var(--tangerine-soft); padding: 5px 0; align-self: start; line-height: 1.05; }
.date small { display: block; font-size: .68em; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--warn); }
.date b { display: block; font-family: var(--font-display); font-size: 1.5em; font-weight: 800; }
.bk-main { min-width: 0; display: grid; gap: 4px; }
.bk h3 { margin: 0; font-size: 1em; line-height: 1.2; }
.bk .when { font-weight: 700; font-size: .9em; }
.bk .when span { color: var(--muted); font-weight: 400; }
.bk .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: .88em; }
.ref { background: var(--surface-2); padding: 2px 7px; border-radius: 6px; border: 0; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-size: .95em; overflow-wrap: anywhere; text-align: left; }
.ref svg { width: 14px; height: 14px; color: var(--muted); flex: 0 0 auto; }
.pay.due { color: var(--warn); font-weight: 700; }
.pay.ok { color: var(--sea); font-weight: 700; }
.bk .actions { margin-top: 2px; }

/* Lists & info */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.li { display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li input { width: 24px; height: 24px; accent-color: var(--sea); flex: 0 0 auto; margin: 0; }
.li label, .li .txt { flex: 1; min-width: 0; }
.li small { display: block; color: var(--muted); }
.li.done label { text-decoration: line-through; color: var(--muted); }
.phone { font-size: 1.2em; font-weight: 700; font-variant-numeric: tabular-nums; text-decoration: none; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tangerine); flex: 0 0 auto; margin-top: 7px; }

/* Home: trip list */
.hero { padding: 22px 16px 8px; }
.hero h1 { margin: 0; font-size: calc(2rem * var(--scale)); line-height: 1; }
.hero p { margin: 6px 0 0; color: var(--muted); }
.trip { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.trip h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.45em; line-height: 1.05; letter-spacing: -.01em; }
.trip h2 { display: flex; align-items: center; gap: 8px; }
.trip-icon { font-size: 1.1em; line-height: 1; flex: 0 0 auto; }
.trip .dates { font-weight: 700; }
.trip .who { color: var(--muted); font-size: .85em; grid-column: 1 / -1; }
.trip .status { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-size: .8em; font-weight: 700; color: var(--sea); }
.trip .status b { display: block; font-family: var(--font-display); font-size: 1.6em; color: var(--ink); }
.trip.past { opacity: .6; }
.add { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 14px; }
.add label { font-weight: 700; }
.add .row2 { display: flex; gap: 8px; }
.add input, .gate input { font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; width: 100%; flex: 1 1 0; }
.err { color: var(--warn); min-height: 1.2em; font-size: .9em; }

/* Bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tab { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: .75em; font-weight: 700; color: var(--muted); cursor: pointer; border-radius: 10px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--ink); background: var(--surface-2); }

/* Gate */
.gate { max-width: 360px; margin: 16vh auto 0; padding: 0 16px; display: grid; gap: 12px; text-align: center; }
.gate h1 { margin: 0; font-size: 2.2rem; }
.gate input { font-size: 1.6rem; text-align: center; letter-spacing: .3em; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 99px; font-size: .9em; z-index: 9; max-width: calc(100% - 32px); }
.toast a { color: inherit; font-weight: 700; text-decoration: underline; display: block; padding: 4px 2px; }
/* v14: open/close motion is done in JS (growIn / shrinkOut); our own scroll holding replaces the browser's scroll anchoring */
html { overflow-anchor: none; }
.detail { align-content: start; } /* while its height animates, content stays packed at the top */
/* expanded item: soft see-through wash in the ring colours (tangerine -> gold -> sea), fades in/out with the open state */
:root { --open-wash: linear-gradient(150deg, rgba(232, 118, 26, .06), rgba(242, 183, 5, .04) 50%, rgba(63, 179, 169, .06)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --open-wash: linear-gradient(150deg, rgba(245, 154, 69, .08), rgba(242, 183, 5, .04) 50%, rgba(63, 179, 169, .08)); } }
:root[data-theme="dark"] { --open-wash: linear-gradient(150deg, rgba(245, 154, 69, .08), rgba(242, 183, 5, .04) 50%, rgba(63, 179, 169, .08)); }
.item { isolation: isolate; }
.item::after { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: var(--open-wash); opacity: 0; transition: opacity .3s ease; }
.item.open::after { opacity: 1; transition-duration: .45s; }
/* ---------- v8: icon comes alive while its row is expanded ----------
   .a-on = extra scene bits (shown only when open), .a-off = bits that hide when open,
   .m-* = moving parts. Motion only matches .item.open, so collapsing stops it.
   Reduce Motion (iPhone setting) keeps the open scene but without movement. */
:root { --coin: #F2B705; --coin-edge: #9A6A00; }
svg .a-on { opacity: 0; }
.row .ic svg { overflow: visible; transition: width .2s, height .2s; }
.row .ic svg * { transform-box: view-box; }
.item.open .row .ic svg { width: 21px; height: 21px; }
.item.open .row .ic .a-on { opacity: 1; transition: opacity .25s; }
.item.open .row .ic .a-off { opacity: 0; }
.ic .coins circle { fill: var(--coin); stroke: var(--coin-edge); stroke-width: 1.2; }
.ic .m-go { stroke-dasharray: .01 20; stroke-dashoffset: 12; }
@media (prefers-reduced-motion: no-preference) {
  .item.open .row .ic { animation: icpop .5s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes icpop { from { transform: scale(.75); } }
  /* Flight */
  .item.open .ic .m-fly { animation: fly 1.6s ease-in-out infinite alternate; }
  @keyframes fly { from { transform: translate(-1.5px, 1px) rotate(2deg); } to { transform: translate(1.5px, -1.5px) rotate(-3deg); } }
  .item.open .ic .m-trail { animation: trail .9s linear infinite; }
  .item.open .ic .t2 { animation-delay: -.45s; }
  @keyframes trail { from { transform: translateX(6px); opacity: 0; } 30% { opacity: 1; } to { transform: translateX(-5px); opacity: 0; } }
  /* Hotel: zzz */
  .item.open .ic .m-z { animation: zz 2.1s ease-out infinite; }
  .item.open .ic .z2 { animation-delay: .7s; }
  .item.open .ic .z3 { animation-delay: 1.4s; }
  @keyframes zz { 0% { transform: translate(-2px, 4px) scale(.5); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(2px, -3px) scale(1.1); opacity: 0; } }
  /* Car: front view, bouncing along, road dashes rushing past */
  .item.open .ic .m-bob { animation: bob .35s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-.7px); } }
  .item.open .ic .m-dash { animation: dash .6s linear infinite; }
  .item.open .ic .d2 { animation-delay: -.3s; }
  @keyframes dash { from { transform: translateY(-1.5px) scale(.6); transform-origin: 12px 20px; opacity: 0; } 40% { opacity: 1; } to { transform: translateY(3px) scale(1.4); transform-origin: 12px 20px; opacity: 0; } }
  /* Nature: tree sways, wind blows */
  .item.open .ic .m-sway { transform-origin: 12px 21px; animation: sway 1.4s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  .item.open .ic .m-wind { animation: wind 1.4s ease-out infinite; }
  .item.open .ic .w2 { animation-delay: .5s; }
  @keyframes wind { from { transform: translateX(-2px); opacity: 0; } 30% { opacity: 1; } to { transform: translateX(5px); opacity: 0; } }
  /* Food: fork and spoon take turns digging in */
  .item.open .ic .m-fork { transform-origin: 6.5px 6px; animation: fork 1.1s ease-in-out infinite; }
  .item.open .ic .m-spoon { transform-origin: 18px 6px; animation: spoon 1.1s ease-in-out infinite; animation-delay: -.55s; }
  @keyframes fork { 0%, 100% { transform: translate(0, 0) rotate(0); } 45% { transform: translate(2px, 3.5px) rotate(18deg); } }
  @keyframes spoon { 0%, 100% { transform: translate(0, 0) rotate(0); } 45% { transform: translate(-2px, 3.5px) rotate(-18deg); } }
  .item.open .ic .m-steam { animation: steam 1.6s ease-in-out infinite; }
  @keyframes steam { from { transform: translateY(1px); opacity: 0; } 50% { opacity: 1; } to { transform: translateY(-2px); opacity: 0; } }
  /* Market: coins pop out of the door */
  .item.open .ic .m-coin { opacity: 0; animation: coin1 1.5s cubic-bezier(.2, .7, .4, 1) infinite; }
  .item.open .ic .c2 { animation-name: coin2; animation-delay: .5s; }
  .item.open .ic .c3 { animation-name: coin3; animation-delay: 1s; }
  @keyframes coin1 { 0% { transform: translate(0, 0) scale(.3); opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-8px, -13px) scale(1.1); opacity: 0; } }
  @keyframes coin2 { 0% { transform: translate(0, 0) scale(.3); opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(0, -16px) scale(1.1); opacity: 0; } }
  @keyframes coin3 { 0% { transform: translate(0, 0) scale(.3); opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(8px, -13px) scale(1.1); opacity: 0; } }
  .item.open .ic .m-coin { transform-origin: 12px 17px; }
  /* Activity (hands-on): hand works away, sparkles twinkle */
  .item.open .ic .m-wave { transform-origin: 9px 22px; animation: wave .5s ease-in-out infinite alternate; }
  @keyframes wave { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
  .item.open .ic .m-spark { transform-origin: 3.5px 3.5px; animation: spark 1s ease-in-out infinite; }
  .item.open .ic .s2 { transform-origin: 22.5px 1.5px; animation-delay: .5s; }
  @keyframes spark { 0%, 100% { transform: scale(.2); opacity: 0; } 50% { transform: scale(1); opacity: 1; } }
  /* Attraction: Ferris wheel turns */
  .item.open .ic .m-spin { transform-origin: 12px 10px; animation: spin 5s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Drive: dot travels the road */
  .item.open .ic .m-go { animation: go 1.8s ease-in-out infinite; }
  @keyframes go { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -20; } }
}
/* ---------- v9: trip background theme ----------
   One fixed layer behind everything. A 'belt' of 150px cells drifts diagonally
   (bottom-left -> top-right) by exactly one cell every 55 s, then loops seamlessly.
   Low opacity + muted colours + very slow speed keep it calm; Reduce Motion = still pattern. */
#bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; display: none; opacity: .42; }
body.has-bg:not(.home) #bg { display: block; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #bg { opacity: .26; } }
:root[data-theme="dark"] #bg { opacity: .26; }
.bg-belt { position: absolute; top: 0; will-change: transform; }
.bgm { position: absolute; overflow: visible; }
/* header copy of the belt: clipped to the strip from the Day label down; header content sits above it */
.hdr-bg { position: absolute; left: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; opacity: .42; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hdr-bg { opacity: .26; } }
:root[data-theme="dark"] .hdr-bg { opacity: .26; }
body.has-bg:not(.home) .top > :not(.hdr-bg) { position: relative; z-index: 1; }
@media (prefers-reduced-motion: no-preference) {
  .bg-belt { animation: belt 55s linear infinite; }
  @keyframes belt { to { transform: translate3d(150px, -150px, 0); } }
  .bgm.rock { transform-origin: 50% 60%; animation: bgrock 6s ease-in-out infinite alternate; }
  @keyframes bgrock { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
  .bgm.hop { transform-origin: 50% 100%; animation: bghop 6s ease-in-out infinite; }
  @keyframes bghop { 0%, 62%, 100% { transform: translateY(0) scale(1, 1); } 70% { transform: translateY(0) scale(1.08, .92); } 80% { transform: translateY(-4px) scale(.96, 1.04); } 90% { transform: translateY(0) scale(1.04, .96); } }
  .bgm.roll { animation: bgroll 16s linear infinite; }
  @keyframes bgroll { to { transform: rotate(360deg); } }
}

/* ---------- v10: weather ----------
   Day buttons get a small weather icon; only the selected day's icon moves.
   The weather strip sits at the top of the day list (scrolls away, keeps the sticky header short).
   'Typical' (no real forecast yet) = faded. Reduce Motion = still icons. */
:root { --sun: #F2B705; --sun-edge: #C98F00; --rain: #2F7FC1; --snow: #4F84B5; --bolt: #F2B705; --cloud-bg: var(--surface); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --rain: #6CB4F0; --snow: #BFD9EF; } }
:root[data-theme="dark"] { --rain: #6CB4F0; --snow: #BFD9EF; }
.wx { overflow: visible; }
.wx * { transform-box: view-box; }
.wx .w-disc { fill: var(--sun); stroke: var(--sun-edge); stroke-width: 1; }
.wx .w-rays { stroke: var(--sun); stroke-width: 2; }
.wx .w-cloud { fill: var(--cloud-bg); stroke: currentColor; stroke-width: 1.7; }
.wx .w-cloud2 { fill: var(--cloud-bg); stroke: currentColor; stroke-width: 1.5; opacity: .6; }
.wx .w-drop { stroke: var(--rain); stroke-width: 2; }
.wx .w-flake { fill: var(--snow); }
.wx .w-bolt { fill: var(--bolt); stroke: var(--sun-edge); stroke-width: .8; stroke-linejoin: round; }
.wx .w-fog { stroke: currentColor; stroke-width: 1.8; opacity: .7; }
.day .wx { display: block; width: 22px; height: 22px; margin: 3px auto 0; color: var(--muted); }
.day[aria-pressed="true"] { --cloud-bg: var(--ink); }
.day[aria-pressed="true"] .wx { color: var(--bg); width: 24px; height: 24px; margin-top: 2px; }
.day .wx.typ { opacity: .45; }
.day .wx-none { display: block; height: 22px; margin-top: 3px; }
/* strip */
.wx-wrap { display: grid; gap: 4px; }
.wx-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px 6px; }
.wx-card.typ { border-style: dashed; }
.wx-card.typ .wx-main, .wx-card.typ .wx-c { opacity: .6; }
.wx-strip { display: flex; align-items: center; gap: 4px 5px; flex-wrap: wrap; cursor: pointer; }
.wx-card { padding: 7px 8px; }
.wx-c b { font-size: .9em; }
.wx-c { min-width: 0; }
.wx-main .wx { width: 30px; height: 30px; display: block; }
.wx-c.hi-wind.gale { padding: 0 3px; }
.wx-c { display: grid; justify-items: center; gap: 1px; min-width: 1.9em; }
.wx-c svg { width: 15px; height: 15px; color: var(--muted); }
.wx-c b { font-variant-numeric: tabular-nums; font-size: .95em; white-space: nowrap; line-height: 1.1; }
.wx-c b small { font-weight: 400; color: var(--muted); font-size: .7em; margin-left: 1px; }
.wx-c.hi-rain svg, .wx-c.hi-rain b { color: var(--rain); }
.wx-c.hi-wind svg, .wx-c.hi-wind b { color: var(--tangerine); }
.wx-c.hi-wind.gale { background: var(--warn-soft); border-radius: 8px; padding: 0 4px; }
.wx-c.hi-wind.gale svg, .wx-c.hi-wind.gale b { color: var(--warn); }
.wx-parts { display: flex; gap: 3px; padding-left: 6px; border-left: 1px solid var(--line); margin-left: auto; }
.wx-parts .wx { width: 17px; height: 17px; }
.wx-strip .wx-twc { flex: 0 0 auto; width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; color: var(--sea); text-decoration: none; }
.wx-strip .wx-twc svg { width: 18px; height: 18px; }
.wx-c + .wx-twc, .wx-tag + .wx-twc { margin-left: auto; }
.wx-parts span { display: grid; justify-items: center; gap: 1px; }
.wx-parts .wx { width: 19px; height: 19px; }
.wx-parts small { font-size: .62em; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.wx-tag { font-size: .66em; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--surface-2); color: var(--muted); }
.wx-meta { font-size: .74em; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; border-top: 1px solid var(--line); margin-top: 7px; padding-top: 5px; }
.wx-legend { font-size: .78em; color: var(--muted); padding: 6px 0 0; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.wx-legend span { display: inline-flex; align-items: center; gap: 4px; }
.wx-legend svg { width: 14px; height: 14px; }
.wx-inline { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.wx-inline .wx { width: 22px; height: 22px; }
.wx-inline svg:not(.wx) { width: 14px; height: 14px; color: var(--muted); vertical-align: -2px; }
.wx-inline .mut { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .day.pop[aria-pressed="true"] .wx, .wx-wrap.pop .wx-main .wx { animation: wxpop .55s cubic-bezier(.3, 1.7, .5, 1); }
  @keyframes wxpop { from { transform: scale(.5); opacity: .3; } }
  .day[aria-pressed="true"] .wx .w-rays, .wx-main .wx .w-rays { transform-origin: var(--sx, 12px) var(--sy, 12px); animation: wxspin 9s linear infinite; }
  @keyframes wxspin { to { transform: rotate(360deg); } }
  .day[aria-pressed="true"] .wx .w-disc, .wx-main .wx .w-disc { transform-origin: var(--sx, 12px) var(--sy, 12px); animation: wxglow 2.4s ease-in-out infinite alternate; }
  @keyframes wxglow { to { transform: scale(1.08); } }
  .day[aria-pressed="true"] .wx .w-drift, .wx-main .wx .w-drift { animation: wxdrift 2.6s ease-in-out infinite alternate; }
  .day[aria-pressed="true"] .wx .w-drift2, .wx-main .wx .w-drift2 { animation: wxdrift 3.4s ease-in-out infinite alternate-reverse; }
  @keyframes wxdrift { from { transform: translateX(-1.2px); } to { transform: translateX(1.4px); } }
  .day[aria-pressed="true"] .wx .w-drop, .wx-main .wx .w-drop { animation: wxrain .8s linear infinite; }
  .day[aria-pressed="true"] .wx .w-flake, .wx-main .wx .w-flake { animation: wxsnow 2.2s linear infinite; }
  .day[aria-pressed="true"] .wx .k2, .wx-main .wx .k2 { animation-delay: -.27s; }
  .day[aria-pressed="true"] .wx .k3, .wx-main .wx .k3 { animation-delay: -.54s; }
  .day[aria-pressed="true"] .wx .w-flake.k2, .wx-main .wx .w-flake.k2 { animation-delay: -.75s; }
  .day[aria-pressed="true"] .wx .w-flake.k3, .wx-main .wx .w-flake.k3 { animation-delay: -1.5s; }
  @keyframes wxrain { from { transform: translateY(-2.5px); opacity: 0; } 25% { opacity: 1; } to { transform: translateY(3.5px); opacity: 0; } }
  @keyframes wxsnow { from { transform: translate(0, -2.5px); opacity: 0; } 20% { opacity: 1; } 50% { transform: translate(1.2px, .5px); } to { transform: translate(-.6px, 4px); opacity: 0; } }
  .day[aria-pressed="true"] .wx .w-bolt, .wx-main .wx .w-bolt { animation: wxflash 2.4s steps(1) infinite; }
  @keyframes wxflash { 0%, 46%, 58%, 100% { opacity: 1; } 48%, 54% { opacity: .1; } 70%, 92% { opacity: .35; } }
  .day[aria-pressed="true"] .wx .w-fog, .wx-main .wx .w-fog { animation: wxdrift 2s ease-in-out infinite alternate; }
  .day[aria-pressed="true"] .wx .w-fog.k2, .wx-main .wx .w-fog.k2 { animation-direction: alternate-reverse; }
}

/* ---------- v10d: selected day = lifted card with a glowing, slowly turning ring (no black fill) ---------- */
@property --ring { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
@property --glint { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
.days { padding: 9px 16px 12px; }
.day { position: relative; transition: transform .25s cubic-bezier(.3, 1.5, .5, 1); }
.day[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: transparent; transform: translateY(-2px) scale(1.05); z-index: 1;
  box-shadow: 0 0 0 1px rgba(232, 118, 26, .25), 0 6px 14px -4px rgba(232, 118, 26, .55); --cloud-bg: var(--surface); }
/* ring = colour band + a bright glint layered on top that travels round it */
.day[aria-pressed="true"]::before { content: ''; position: absolute; inset: -2.5px; border-radius: 14.5px; padding: 2.5px; pointer-events: none;
  background: conic-gradient(from var(--glint), transparent 0 78%, rgba(255, 246, 214, .55) 86%, #fff 90%, rgba(255, 246, 214, .55) 94%, transparent 100%),
    conic-gradient(from var(--ring), #E8761A, #F2B705, #3FB3A9, #E8761A);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.day[aria-pressed="true"] small { color: var(--tangerine); opacity: 1; font-weight: 700; }
.day[aria-pressed="true"] .wx { color: var(--ink); }
@media (prefers-reduced-motion: no-preference) {
  .day[aria-pressed="true"]::before { animation: dayring 4s linear infinite, dayglint 1.8s cubic-bezier(.45, .05, .55, .95) infinite; }
  @keyframes dayring { to { --ring: 360deg; } }
  @keyframes dayglint { to { --glint: 360deg; } }
  .day[aria-pressed="true"] { animation: dayglow 2.2s ease-in-out infinite alternate; }
  @keyframes dayglow { from { box-shadow: 0 0 0 1px rgba(232, 118, 26, .2), 0 4px 10px -4px rgba(232, 118, 26, .45); }
    to { box-shadow: 0 0 0 1px rgba(232, 118, 26, .35), 0 0 16px 1px rgba(242, 183, 5, .5); } }
  .day.pop[aria-pressed="true"] { animation: daypop .45s cubic-bezier(.3, 1.6, .5, 1), dayglow 2.2s .45s ease-in-out infinite alternate; }
  @keyframes daypop { from { transform: translateY(0) scale(.9); } }
}

/* ---------- v10e: weather card in two rows: what the day is like, then four colour-coded tiles ---------- */
.wx-strip { display: grid; gap: 7px; }
.wx-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.wx-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
.wx-name b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wx-top .wx-parts { margin-left: auto; }
.wx-top .wx-twc { margin-left: 0; }
.wx-name + .wx-twc { margin-left: auto; }
.wx-tiles { display: flex; gap: 6px; }
.wx-t { flex: 1 1 0; min-width: max-content; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 6px 7px; border-radius: 10px; background: var(--surface-2); }
.wx-t svg { width: 15px; height: 15px; flex: 0 0 auto; }
.wx-t b { font-variant-numeric: tabular-nums; font-size: .92em; white-space: nowrap; }
.wx-t b small { font-weight: 400; font-size: .72em; color: var(--muted); margin-left: 2px; }
.t-temp { background: var(--food-bg); } .t-temp svg { color: var(--food); }
.t-feel { background: var(--att-bg); } .t-feel svg { color: var(--att); }
.t-rain { background: var(--act-bg); } .t-rain svg { color: var(--act); }
.t-rain.hi { background: var(--rain); } .t-rain.hi svg, .t-rain.hi b { color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .t-rain.hi svg, :root:not([data-theme="light"]) .t-rain.hi b { color: #0B1413; } }
:root[data-theme="dark"] .t-rain.hi svg, :root[data-theme="dark"] .t-rain.hi b { color: #0B1413; }
.t-wind { background: var(--nat-bg); } .t-wind svg { color: var(--nat); }
.t-wind.windy { background: var(--tangerine-soft); } .t-wind.windy svg { color: var(--tangerine); }
.t-wind.gale { background: var(--warn-soft); box-shadow: inset 0 0 0 1.5px var(--warn); } .t-wind.gale svg, .t-wind.gale b { color: var(--warn); }
.wx-card.typ .wx-t, .wx-card.typ .wx-main { opacity: .7; }

/* ---------- v10f: one row of colour-coded tiles (icon over value) + AM/PM/EVE + Weather Channel ---------- */
.wx-strip { display: block; }
.wx-row { display: flex; align-items: stretch; gap: 5px; }
.wx-row .wx-t { flex: 1 1 auto; min-width: 0; flex-direction: column; gap: 2px; padding: 5px 4px; }
.wx-row .wx-t svg { width: 15px; height: 15px; }
.wx-row .wx-t b { font-size: .9em; line-height: 1.1; }
.wx-row .wx-parts { align-self: center; margin-left: 2px; }
.wx-row .wx-tag { align-self: center; margin-left: 2px; }
.wx-row .wx-twc { align-self: center; margin-left: 0; }

/* ---------- v10g: AM/PM/EVE first; temp + feels share one static light-orange tile; rain and wind colours scale with strength ---------- */
:root { --tile-warm: #FFF0E2; --tile-warm-ic: #C2611A;
  --r0: #EEF5FC; --r1: #D3E6F8; --r2: #4C93D6; --r3: #1D5A9E;
  --w0: #DDF0E0; --w0i: #2E7D45; --w1: #FFF1C2; --w1i: #946200; --w2: #FFE0C2; --w2i: #C2550E; --w3: #FCDAD4; --w3i: #B42318; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tile-warm: #33251A; --tile-warm-ic: #F59A45;
  --r0: #16222E; --r1: #1B3550; --r2: #22568F; --r3: #2F7FD0;
  --w0: #17321F; --w0i: #7FD39A; --w1: #3A3115; --w1i: #F2C94C; --w2: #3E2614; --w2i: #F59A45; --w3: #45201C; --w3i: #FF8A7A; } }
:root[data-theme="dark"] { --tile-warm: #33251A; --tile-warm-ic: #F59A45;
  --r0: #16222E; --r1: #1B3550; --r2: #22568F; --r3: #2F7FD0;
  --w0: #17321F; --w0i: #7FD39A; --w1: #3A3115; --w1i: #F2C94C; --w2: #3E2614; --w2i: #F59A45; --w3: #45201C; --w3i: #FF8A7A; }
.t-temp, .t-feel { background: var(--tile-warm); }
.t-temp svg, .t-feel svg { color: var(--tile-warm-ic); }
.t-rain.r0 { background: var(--r0); } .t-rain.r1 { background: var(--r1); }
.t-rain.r0 svg, .t-rain.r1 svg { color: var(--act); }
.t-rain.r2 { background: var(--r2); } .t-rain.r3 { background: var(--r3); }
.t-rain.r2 svg, .t-rain.r2 b, .t-rain.r3 svg, .t-rain.r3 b { color: #fff; }
.t-wind.w0 { background: var(--w0); } .t-wind.w0 svg { color: var(--w0i); }
.t-wind.w1 { background: var(--w1); } .t-wind.w1 svg { color: var(--w1i); }
.t-wind.w2 { background: var(--w2); } .t-wind.w2 svg, .t-wind.w2 b { color: var(--w2i); }
.t-wind.w3 { background: var(--w3); box-shadow: inset 0 0 0 1.5px var(--w3i); } .t-wind.w3 svg, .t-wind.w3 b { color: var(--w3i); }
.wx-row .wx-parts { margin: 0 1px 0 0; padding: 0 7px 0 0; border-left: 0; border-right: 1px solid var(--line); }
.wx-row .wx-tag { margin: 0 2px 0 0; }

/* ---------- v10h: expanded itinerary item = thin glowing ring (same as the selected day) ---------- */
.item { position: relative; }
.item.open::before { content: ''; position: absolute; inset: 0; border-radius: 12px; padding: 1.5px; pointer-events: none; z-index: 2;
  background: conic-gradient(from var(--glint), transparent 0 78%, rgba(255, 246, 214, .55) 86%, #fff 90%, rgba(255, 246, 214, .55) 94%, transparent 100%),
    conic-gradient(from var(--ring), #E8761A, #F2B705, #3FB3A9, #E8761A);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.tl .item:first-child.open::before { border-radius: calc(var(--r) - 1px) calc(var(--r) - 1px) 12px 12px; }
.tl .item:last-child.open::before { border-radius: 12px 12px calc(var(--r) - 1px) calc(var(--r) - 1px); }
.tl .item:only-child.open::before { border-radius: calc(var(--r) - 1px); }
@media (prefers-reduced-motion: no-preference) {
  .item.open::before { animation: dayring 4s linear infinite, dayglint 1.8s cubic-bezier(.45, .05, .55, .95) infinite, ringin .45s ease-out; }
  @keyframes ringin { from { opacity: 0; } }
}

/* ---------- v11: Activities in Bookings ---------- */
.sub-h { display: flex; justify-content: space-between; gap: 8px; padding: 7px 12px 5px; border-top: 1px solid var(--line);
  background: var(--surface-2); font-size: .74em; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--muted); }
.sub-h .num { letter-spacing: 0; text-transform: none; font-weight: 700; }
.bk-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: .8em; font-weight: 800; letter-spacing: .04em; line-height: 1.5; }
.bk-badge.todo { background: var(--tangerine); color: #fff; }
.bk-badge.todo.soft { background: transparent; color: var(--tangerine); box-shadow: inset 0 0 0 1.5px var(--tangerine); }
.bk-badge.ok { background: var(--sea-soft); color: var(--sea); }
.bk-badge svg { width: 13px; height: 13px; }

/* ---------- v13: photo lightbox (tap a photo to enlarge) ---------- */
.carousel .slide { cursor: zoom-in; -webkit-tap-highlight-color: transparent; }
.carousel .slide img:focus-visible { outline: 3px solid var(--accent, #E8730C); outline-offset: -3px; }
.carousel .expand { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0, 0, 0, .5); color: #fff; display: grid; place-items: center; pointer-events: none; transition: transform .18s ease, background .18s ease; }
.carousel .expand svg { width: 15px; height: 15px; }
@media (hover: hover) { .carousel:hover .expand { background: rgba(0, 0, 0, .72); transform: scale(1.1); } }

.lb { position: fixed; inset: 0; z-index: 50; color: #fff; touch-action: none; overscroll-behavior: contain; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }

P.Activities = P.Activity; P.Shop = P.Market;
const iconKey = (n) => ({ Activities: 'Activity', Shop: 'Market' })[n] || (P[n] ? n : 'Activity'); // unknown types use the hand
const icon = (n, cls) => '<svg class="k-' + iconKey(n) + (cls ? ' ' + cls : '') + '"' + ' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (P[n] || P.Activity) + '</svg>';

/* ---------- time (trip times are wall clock at the destination) ---------- */
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

async function unlock(code) {

    } else if (b.category === 'Hotel') {
      add({ key: b.id + 'a', type: 'Hotel', title: 'Check in · ' + b.title, place: b.title, date: sd, start: st, end: '', label: 'from' });
      add({ key: b.id + 'b', type: 'Hotel', title: 'Check out · ' + b.title, place: b.title, date: ed, start: et, end: '', label: 'by' });
    } else if (b.category === 'Car') {
      const carPlace = b.title.split(' · ')[0] + (b.fromDepTerminal ? ' ' + b.fromDepTerminal : '');
      add({ key: b.id + 'a', type: 'Car', title: 'Pick up car', place: carPlace, sub: b.title + (b.fromDepTerminal ? ' · ' + b.fromDepTerminal : ''), date: sd, start: st, end: '' });

/* ---------- HOME: trip list ---------- */
function homeView(msg) {
  document.body.classList.add('home');
  setBg(null);
  const trips = Object.values(myTrips()).map((t) => t.summary).filter(Boolean)
    .sort((a, b) => (a.start || '').localeCompare(b.start || ''));
  const n = now(), todayD = localParts(n).date;
  const upcoming = trips.filter((t) => !t.end || t.end >= todayD), past = trips.filter((t) => t.end && t.end < todayD);
  const card = (t) => {
    let status = '';
    if (t.start && todayD < t.start) { const d = Math.ceil((toMs(t.start, '00:00') - n) / 864e5); status = '<b class="num">' + d + '</b>' + (d === 1 ? 'day to go' : 'days to go'); }
    else if (t.end && todayD <= t.end) status = '<b>Now</b>on the trip';
    else status = 'Done';
    return '<a class="trip' + (t.end && t.end < todayD ? ' past' : '') + '" href="#' + esc(t.id) + '"><h2>' +
      (t.icon ? '<span class="trip-icon" aria-hidden="true">' + esc(t.icon) + '</span>' : '') + esc(t.destination || t.tripName) + '</h2>' +
      '<span class="status">' + status + '</span><span class="dates num">' + esc(rangeLabel(t.start, t.end)) + '</span>' +
      (t.travellers ? '<span class="who">' + esc(t.travellers) + '</span>' : '') + '</a>';
  };
  document.getElementById('app').innerHTML =
    '<header class="hero"><h1 class="brand">Cody <span>Trippin</span></h1><p>Your trips with Cody</p></header><main>' +
    (upcoming.length ? '<h2 class="section-h"><span>Upcoming</span></h2>' + upcoming.map(card).join('') : '') +
    addForm(msg, !trips.length) +
    (past.length ? '<h2 class="section-h"><span>Past trips</span></h2>' + past.map(card).join('') : '') + '</main>';
  bindAdd();
}
function addForm(msg, first) {
  return '<form class="add" id="add"><label for="code">' + (first ? 'Enter your trip passcode' : 'Add another trip') + '</label>' +
    '<div class="row2"><input id="code" inputmode="numeric" autocomplete="off" placeholder="Passcode" required>' +
    '<button class="btn go" type="submit">Open</button></div><div class="err" id="err">' + esc(msg || '') + '</div></form>';
}
function bindAdd() {
  const f = document.getElementById('add');
  if (!f) return;
  f.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const code = document.getElementById('code').value.trim(), err = document.getElementById('err');
    err.textContent = 'Checking…';
    try {
      const found = await unlock(code);
      if (!found.length) { err.textContent = 'That passcode doesn’t match a trip. Check with Cody.'; return; }
      const t = myTrips();
      found.forEach((s) => { t[s.id] = { code, summary: s }; });
      saveTrips(t);
      if (found.length === 1) location.hash = found[0].id; else homeView();
    } catch (e) { err.textContent = 'No connection. Connect to the internet to add a trip.'; }
  });
}

/* ---------- v9: trip background theme (Jeju = tangerines + dol hareubang drifting diagonally) ----------
   Cells are 150px. Each cell's layout depends only on (row + col), so after the belt moves one
   cell up-right the picture is identical and the loop is seamless. Add a new theme = add an entry here. */
const BG_T = 150;
const BG = {
  jeju: {
    defs: '<symbol id="m-tang" viewBox="0 0 24 24"><ellipse cx="12" cy="14" rx="9" ry="8" fill="#F39A3B"/><ellipse cx="8.6" cy="10.8" rx="2.2" ry="1.3" fill="#fff" opacity=".45"/><path d="M12 6.6V4.4" stroke="#6B4E2E" stroke-width="1.4" stroke-linecap="round"/><path d="M12.4 5.4c2-2.6 5-2.6 6.6-1.6-1.6 2.6-4.6 3.1-6.6 1.6z" fill="#4FA35B"/><circle cx="9.4" cy="14.6" r=".9" fill="#6B3A1A"/><circle cx="14.6" cy="14.6" r=".9" fill="#6B3A1A"/><path d="M10.8 16.8q1.2 1 2.4 0" stroke="#6B3A1A" stroke-width=".8" fill="none" stroke-linecap="round"/></symbol><symbol id="m-stone" viewBox="0 0 20 28"><path d="M4 10h12v13a4 4 0 01-4 4H8a4 4 0 01-4-4z" fill="#8A8680"/><path d="M3 8.6C3 4 6.2 1.4 10 1.4S17 4 17 8.6z" fill="#8A8680"/><rect x="2" y="7.6" width="16" height="2.4" rx="1.2" fill="#75716B"/><circle cx="6.6" cy="13" r="1.7" fill="#ECE9E3"/><circle cx="13.4" cy="13" r="1.7" fill="#ECE9E3"/><circle cx="6.8" cy="13.2" r=".8" fill="#3B3936"/><circle cx="13.2" cy="13.2" r=".8" fill="#3B3936"/><ellipse cx="10" cy="16.2" rx="1.4" ry="2" fill="#75716B"/><path d="M8.4 19.6h3.2" stroke="#3B3936" stroke-width=".9" stroke-linecap="round"/><path d="M5 23.2c2-1 4-1 5 .2M15 22.4c-1.5-1-3.2-1-4.2.4" stroke="#66625C" stroke-width="1.2" fill="none" stroke-linecap="round"/><circle cx="12.5" cy="5" r=".5" fill="#6E6A64"/><circle cx="7" cy="4.6" r=".45" fill="#6E6A64"/><circle cx="14" cy="25" r=".5" fill="#6E6A64"/></symbol>',
    // [symbol, x, y, width, motion] per layout; a stone is 1.4x taller than wide
    layouts: [
      [['m-tang', 20, 22, 22, 'rock'], ['m-stone', 94, 62, 18, 'hop'], ['m-tang', 44, 112, 14, 'roll']],
      [['m-stone', 28, 20, 17, 'hop'], ['m-tang', 104, 34, 19, 'rock'], ['m-tang', 78, 112, 13, 'roll']],
      [['m-tang', 70, 14, 15, 'roll'], ['m-tang', 16, 86, 21, 'rock'], ['m-stone', 112, 96, 18, 'hop']]
    ]
  }
};
function themeFor(d) {
  const t = (d && d.trip) || {}, k = String(t.theme || '').toLowerCase().trim();
  if (BG[k]) return k;
  return /jeju|제주/i.test((t.destination || '') + ' ' + (t.tripName || '')) ? 'jeju' : null;
}
const BG_LOOP = 55, BG_EPOCH = performance.now(); // seconds per cell (matches the CSS belt animation)
// One belt of cells. Every copy is timed from the same clock, so the main layer and the header copy move in step.
function bgBelt(key, cols, rows, top) {
  const th = BG[key], el = (performance.now() - BG_EPOCH) / 1000;
  let cells = '';
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const d = r + c, lay = th.layouts[d % th.layouts.length];
    cells += lay.map(([id, x, y, w, m], j) => '<svg class="bgm ' + m + '" style="left:' + (c * BG_T + x) + 'px;top:' + (r * BG_T + y) +
      'px;width:' + w + 'px;height:' + Math.round(id === 'm-stone' ? w * 1.4 : w) + 'px;animation-delay:-' + (el + (d * 1.3 + j * 2.1) % 6).toFixed(2) + 's">' +
      '<use href="#' + id + '" width="100%" height="100%"/></svg>').join('');
  }
  return '<div class="bg-belt" style="left:-' + BG_T + 'px;top:' + top + 'px;width:' + cols * BG_T + 'px;height:' + rows * BG_T +
    'px;animation-delay:-' + (el % BG_LOOP).toFixed(2) + 's">' + cells + '</div>';
}
function setBg(key) {
  const el = document.getElementById('bg');
  if (!el) return;
  document.body.classList.toggle('has-bg', !!key);
  if (!key) return;
  const cols = Math.ceil(innerWidth / BG_T) + 2, rows = Math.ceil(innerHeight / BG_T) + 2, sig = key + cols + 'x' + rows;
  if (el.dataset.k === sig) return; // already built for this size
  el.innerHTML = '<svg width="0" height="0" style="position:absolute" aria-hidden="true">' + BG[key].defs + '</svg>' + bgBelt(key, cols, rows, 0);
  el.dataset.k = sig;
}
// Copy of the belt inside the sticky header, clipped to start at the "Day N · date" line.
function bgHeader() {
  const top = document.getElementById('top'), sub = document.getElementById('sub');
  const key = document.body.classList.contains('has-bg') && themeFor(S.data);
  if (!top || !sub || !key) return;
  const ht = top.getBoundingClientRect().top, st = Math.round(sub.getBoundingClientRect().top - 4);
  const d = document.createElement('div');
  d.className = 'hdr-bg'; d.setAttribute('aria-hidden', 'true'); d.style.top = (st - ht) + 'px';
  d.innerHTML = bgBelt(key, Math.ceil(innerWidth / BG_T) + 2, Math.ceil((top.getBoundingClientRect().bottom + BG_T) / BG_T) + 1, -st);
  top.prepend(d);
}
addEventListener('resize', () => { clearTimeout(setBg.t); setBg.t = setTimeout(() => { if (S.data && document.body.classList.contains('has-bg')) { setBg(themeFor(S.data)); render(true); } }, 300); });

function render(keepScroll) {
  if (!S.data) return;
  document.body.classList.remove('home');
  setBg(themeFor(S.data));
  const y = window.scrollY;
  const slides = Array.prototype.map.call(document.querySelectorAll('.carousel .track'), (t) => Math.round(t.scrollLeft / (t.clientWidth || 1)));
  const views = { today: todayView, bookings: bookingsView, lists: listsView, info: infoView };
  document.getElementById('app').innerHTML = header() + (views[S.tab] || todayView)() + tabs();
  centerDay();
  bgHeader();
  S.wxPop = false;
  document.querySelectorAll('.carousel .track').forEach((t, i) => { if (slides[i]) t.scrollLeft = slides[i] * t.clientWidth; carouselDots(t); });
  if (keepScroll) window.scrollTo(0, y);
}
function centerDay() {
  const strip = document.getElementById('days'), b = strip && strip.querySelector('[aria-pressed="true"]');
  if (b) strip.scrollLeft = b.offsetLeft - strip.clientWidth / 2 + b.clientWidth / 2; // horizontal only; never moves the page
}
function pickDefaultDay() {
  const d = localParts(now()).date;
  S.day = S.days.includes(d) ? d : (d < S.days[0] ? S.days[0] : S.days[S.days.length - 1]);
}

/* ---------- interactions ---------- */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 1800);
}
function toastLink(msg, href) {
  const t = document.getElementById('toast');
  t.innerHTML = '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(msg) + ' ↗</a>';
  t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 8000);
}
/* ---------- v14: smooth expand / collapse ---------- */
const EASE_OPEN = 'cubic-bezier(.22, 1, .36, 1)', EASE_CLOSE = 'cubic-bezier(.4, 0, .2, 1)', T_OPEN = 380, T_CLOSE = 280;
const calm = () => !Element.prototype.animate || matchMedia('(prefers-reduced-motion: reduce)').matches;
// details grow from `from` px (0, or wherever a half-closed copy was) to full height; parts fade in one after another
function growIn(d, from) {
  if (!d || calm()) return;
  const h = d.offsetHeight, pb = getComputedStyle(d).paddingBottom;
  d.style.overflow = 'hidden';
  const a = d.animate([{ height: (from || 0) + 'px', paddingBottom: from ? pb : '0px' }, { height: h + 'px', paddingBottom: pb }], { duration: T_OPEN, easing: EASE_OPEN });
  a.onfinish = a.oncancel = () => { d.style.overflow = ''; };
  if (!from) [...d.children].forEach((c, i) => c.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }],
    { duration: 300, delay: 70 + i * 45, easing: EASE_OPEN, fill: 'backwards' }));
}
// details fold to 0 and fade, then are removed; returns how long that takes (0 = removed at once)
function shrinkOut(d) {
  if (!d) return 0;
  d.classList.add('closing');
  if (calm()) { d.remove(); return 0; }
  const h = d.getBoundingClientRect().height, pb = getComputedStyle(d).paddingBottom;
  d.getAnimations({ subtree: true }).forEach((a) => a.cancel());
  d.style.overflow = 'hidden'; d.style.pointerEvents = 'none';
  const a = d.animate([{ height: h + 'px', paddingBottom: pb, opacity: 1 }, { height: '0px', paddingBottom: '0px', opacity: 0 }], { duration: T_CLOSE, easing: EASE_CLOSE, fill: 'forwards' });
  a.onfinish = () => d.remove();
  return T_CLOSE;
}
// glide the page so an item's top sits just under the sticky header (dates bar). The target is re-measured every
// frame, so it stays right while another item above is folding away. Touching/scrolling cancels it (your finger wins).
let glideId = 0;
['touchstart', 'wheel', 'keydown'].forEach((t) => addEventListener(t, () => { glideId++; }, { passive: true }));
function glideToTop(el) {
  const gap = 8, id = ++glideId;
  const target = () => { const top = document.getElementById('top'); return el.getBoundingClientRect().top - (top ? top.getBoundingClientRect().bottom : 0) - gap; };
  if (calm()) { window.scrollBy(0, target()); return; }
  const y0 = window.scrollY, dist = Math.abs(target()), dur = Math.min(650, 340 + dist * .25), t0 = performance.now();
  (function step(now) {
    if (id !== glideId || !el.isConnected) return;
    const t = Math.min(1, (now - t0) / dur), k = 1 - Math.pow(1 - t, 3); // ease-out
    // where the page should end up: minus whatever is still folding away above this item, so it doesn't overshoot
    const folding = [...document.querySelectorAll('.detail.closing')].filter((d) => d.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING)
      .reduce((sum, d) => sum + d.getBoundingClientRect().height, 0);
    const goal = window.scrollY + target() - folding;
    window.scrollTo(0, y0 + (goal - y0) * k);
    if (t < 1) requestAnimationFrame(step);
  })(t0);
}
function toggleItem(key) {
  const el = document.querySelector('.item[data-key="' + key + '"]');
  const e = S.events.find((x) => x.key === key);
  if (!el || !e) return;
  const btn = el.querySelector('.row');
  if (S.open.has(key)) {
    S.open.delete(key); el.classList.remove('open'); btn.setAttribute('aria-expanded', 'false');
    return shrinkOut(el.querySelector('.detail:not(.closing)'));
  }
  // only one item open at a time: the other one folds away while this one opens and glides up under the dates bar
  [...S.open].forEach((k) => { if (k !== key) toggleItem(k); });
  // tapped again while it was still folding: carry on from its current height
  let from = 0;
  el.querySelectorAll('.detail.closing').forEach((x) => { from = Math.max(from, x.getBoundingClientRect().height); x.remove(); });
  S.open.add(key); el.classList.add('open'); el.insertAdjacentHTML('beforeend', detail(e)); btn.setAttribute('aria-expanded', 'true');
  growIn(el.querySelector('.detail:not(.closing)'), from);
  glideToTop(el);

}
document.addEventListener('click', async (ev) => {
  const nav = ev.target.closest('a[href^="nmap://"]');
  if (nav) { // hand off to the Naver Map app; this page never navigates away
    const web = nav.dataset.web;
    if (web) { // still here after a moment (pop-up cancelled, or no app)? offer the website in a new tab
      const t = setTimeout(() => { if (!document.hidden) toastLink('Didn’t open? Open Naver website', web); }, 2500);
      document.addEventListener('visibilitychange', () => clearTimeout(t), { once: true });
    }
    return;
  }
  if (!ev.target.closest('.wx-twc') && ev.target.closest('#wxs')) { S.wxLegend = !S.wxLegend; render(true); return; }
  const el = ev.target.closest('[data-tab],[data-day],[data-open],[data-copy],[data-tk],#me,#big,#refresh');
  if (!el) return;
  if (el.dataset.tab) { S.tab = el.dataset.tab; store.set('tab', S.tab); render(); window.scrollTo(0, 0); }
  else if (el.dataset.day) { S.day = el.dataset.day; S.open.clear(); S.wxPop = true; render(); window.scrollTo(0, 0); }
  else if (el.dataset.tk) { tapTick(el.dataset.tk); }
  else if (el.id === 'me') { openPicker(); }
  else if (el.dataset.open) { toggleItem(el.dataset.open); }
  else if (el.dataset.copy != null) {
    ev.stopPropagation();
    try { await navigator.clipboard.writeText(el.dataset.copy); toast('Copied ' + el.dataset.copy); } catch (e) { toast(el.dataset.copy); }
  } else if (el.id === 'big') { const on = document.documentElement.classList.toggle('big'); store.set('big', on); render(true); }
  else if (el.id === 'refresh') { await loadTrip(S.tripId, true); }
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.dataset && t.dataset.tick) {
    const k = 'ticks:' + S.tripId, ticks = store.get(k, {}); ticks[t.dataset.tick] = t.checked; store.set(k, ticks);
    t.closest('.li').classList.toggle('done', t.checked);
  }
});

/* ---------- v16: per-traveller ticks ----------
   Each traveller ticks their own list: tap = Done, tap again = not done.
   Saved on the phone at once (ct:prog:<trip>:<who>), queued (ct:q:<trip>) and sent to the sheet's
   Progress tab in the background; no signal = it waits and sends later. Newest tap wins. */
const TK_NEXT = { '': 'done', done: '' };
const TK_SAY = { done: 'Done', '': 'Not done' };
const ME_COL = ['#E8761A', '#13706A', '#5B45A8', '#1F5FA8', '#A3346C', '#2E7D45'];
const travellers = () => String(((S.data && S.data.trip) || {}).travellers || '').split(/\s*(?:,|·|&|\/|\band\b)\s*/).map((x) => x.trim()).filter(Boolean);
const initials = (n) => { const w = String(n).trim().split(/\s+/); return (w.length > 1 ? w[0][0] + w[w.length - 1][0] : String(n).slice(0, 2)).toUpperCase(); };
const meCol = (n) => ME_COL[Math.max(0, travellers().indexOf(n)) % ME_COL.length];
const progKey = () => 'prog:' + S.tripId + ':' + S.me;
const tkOf = (e) => (S.me && e.uid && S.prog[e.uid] && S.prog[e.uid].s === 'done' ? 'done' : '');
function loadMe(id) {
  S.me = store.get('me:' + id, null);
  S.prog = S.me ? store.get('prog:' + id + ':' + S.me, {}) : {};
}
function tickCls(e) { return tkOf(e) === 'done' ? ' tk-done' : ''; }
function tickBtn(e) {
  const t = tkOf(e);
  const lab = t === 'done' ? 'Done' : 'Not done yet';
  return '<button class="tk' + (t ? ' ' + t : '') + '" data-tk="' + esc(e.key) + '" aria-label="' + esc(e.title + ': ' + lab + '. Tap to change') + '">' +
    '<span class="tk-c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M5.5 12.5l4 4 9-9.5"/>' + '</svg></span></button>';
}
function meBtn() {
  if (!travellers().length) return '';
  const pend = store.get('q:' + S.tripId, []).length;
  return '<button class="icon-btn me' + (pend ? ' pending' : '') + '" id="me" aria-label="' + esc(S.me ? 'Ticking as ' + S.me + '. Change' : 'Who are you?') + '">' +
    (S.me ? '<span class="me-av" style="--me:' + meCol(S.me) + '">' + esc(initials(S.me)) + '</span>' : '<span class="me-av none">?</span>') + '</button>';
}
function updDot() { const b = document.getElementById('me'); if (b) b.classList.toggle('pending', store.get('q:' + S.tripId, []).length > 0); }
function tapTick(key) {
  const e = S.events.find((x) => x.key === key);
  if (!e) return;
  if (!S.me) { openPicker(key); return; }
  const s = TK_NEXT[tkOf(e)], at = Date.now();
  S.prog[e.uid] = { s, at };
  store.set(progKey(), S.prog);
  const q = store.get('q:' + S.tripId, []).filter((o) => !(o.who === S.me && o.id === e.uid));
  q.push({ who: S.me, id: e.uid, s, at, date: e.date, title: e.title });
  store.set('q:' + S.tripId, q);
  paintTick(key, true);
  toast(TK_SAY[s]);
  try { if (navigator.vibrate) navigator.vibrate(8); } catch (x) {}
  flushTicks();
}
// update one row in place (no re-render, so an open item, photos and animations stay as they are)
function paintTick(key, pop) {
  const el = document.querySelector('.item[data-key="' + key + '"]'), e = S.events.find((x) => x.key === key);
  if (!el || !e) return;
  const t = tkOf(e);
  el.classList.toggle('tk-done', t === 'done');
  const b = el.querySelector(':scope > .tk');
  if (b) { b.outerHTML = tickBtn(e); if (pop && t) { const nb = el.querySelector(':scope > .tk'); nb && nb.classList.add('pop'); } }
  updDot();
}
async function apiPost(body) { // text/plain body: no CORS pre-check, Apps Script reads e.postData.contents
  const r = await fetch(CONFIG.api, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' });
  return r.json();
}
let tkBusy = false;
async function flushTicks() {
  const id = S.tripId, entry = id && myTrips()[id];
  if (!entry) return;
  if (tkBusy) { flushTicks.again = true; return; }
  const q = store.get('q:' + id, []);
  if (!q.length) { updDot(); return; }
  tkBusy = true;
  try {
    for (const who of [...new Set(q.map((o) => o.who))]) {
      const ops = q.filter((o) => o.who === who);
      const j = await apiPost({ action: 'tick', trip: id, code: entry.code, who, ops });
      const sent = (o) => ops.some((x) => x.id === o.id && x.at === o.at && x.who === o.who);
      if (j && j.ok) {
        store.set('q:' + id, store.get('q:' + id, []).filter((o) => !sent(o)));
        if (who === S.me && S.tripId === id && j.ticks) mergeTicks(j.ticks);
      } else if (j && (j.error === 'unknown_traveller' || j.error === 'unknown_trip')) {
        store.set('q:' + id, store.get('q:' + id, []).filter((o) => !sent(o))); // name no longer on the trip: don't retry forever
      } else break; // old backend / sheet busy: keep the queue, try again later
    }
  } catch (x) { /* no signal: keep the queue */ }
  tkBusy = false;
  updDot();
  if (flushTicks.again) { flushTicks.again = false; return flushTicks(); } // taps made while sending
  if (store.get('q:' + id, []).length && !flushTicks.t) flushTicks.t = setTimeout(() => { flushTicks.t = 0; flushTicks(); }, 60000);
}
// ticks made on this person's other phone come down from the sheet; anything still queued here wins
function mergeTicks(server) {
  const pend = new Set(store.get('q:' + S.tripId, []).filter((o) => o.who === S.me).map((o) => o.id));
  const changed = [];
  Object.entries(server).forEach(([k, v]) => {
    if (pend.has(k)) return;
    const l = S.prog[k];
    if (!l || (l.at || 0) < (v.at || 0)) { S.prog[k] = v; changed.push(k); }
  });
  if (!changed.length) return;
  store.set(progKey(), S.prog);
  S.events.filter((e) => changed.includes(e.uid)).forEach((e) => paintTick(e.key));
}
async function syncTicks() {
  await flushTicks();
  const id = S.tripId, entry = id && myTrips()[id];
  if (!S.me || !entry) return;
  try { const j = await apiPost({ action: 'progress', trip: id, code: entry.code, who: S.me }); if (j && j.ok && j.ticks && S.tripId === id) mergeTicks(j.ticks); } catch (x) {}
}
function setMe(name) {
  S.me = name; store.set('me:' + S.tripId, name);
  S.prog = store.get(progKey(), {});
  render(true);
  syncTicks();
}
function askMeOnce() {
  const t = travellers();
  if (S.me || !t.length || store.get('askedMe:' + S.tripId, false)) return;
  if (t.length === 1) { setMe(t[0]); return; }
  store.set('askedMe:' + S.tripId, true);
  setTimeout(() => openPicker(), 350);
}
function openPicker(thenTick) {
  closePicker(true);
  const t = travellers();
  if (!t.length) return;
  const pend = store.get('q:' + S.tripId, []).length;
  const d = document.createElement('div');
  d.className = 'pick'; d.id = 'pick';
  d.innerHTML = '<div class="pick-scrim" data-pick-x></div><div class="pick-card" role="dialog" aria-modal="true" aria-labelledby="pick-h">' +
    '<button class="pick-x" data-pick-x aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
    '<h2 id="pick-h">Who’s ticking?</h2><p>Your ticks are saved under your name.</p>' +
    '<div class="pick-row">' + t.map((n) => '<button class="pick-p' + (n === S.me ? ' on' : '') + '" data-pick="' + esc(n) + '"><span class="me-av" style="--me:' + meCol(n) + '">' + esc(initials(n)) + '</span><b>' + esc(n) + '</b></button>').join('') + '</div>' +
    (pend ? '<p class="pick-q"><span class="pdot"></span>' + pend + ' tick' + (pend > 1 ? 's' : '') + ' waiting for signal to reach the sheet</p>' : '') + '</div>';
  d.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-pick],[data-pick-x]');
    if (!b) return;
    if (b.dataset.pick) { const was = S.me; closePicker(); if (b.dataset.pick !== was) setMe(b.dataset.pick); if (thenTick) tapTick(thenTick); }
    else closePicker();
  });
  document.addEventListener('keydown', pickKey);
  document.body.appendChild(d);
  requestAnimationFrame(() => d.classList.add('in'));
  d.querySelector('.pick-card').setAttribute('tabindex', '-1'); d.querySelector('.pick-card').focus({ preventScroll: true });
}
function pickKey(ev) { if (ev.key === 'Escape') closePicker(); }
function closePicker(now) {
  const d = document.getElementById('pick');
  document.removeEventListener('keydown', pickKey);
  if (!d) return;
  if (now || calm()) { d.remove(); return; }
  d.classList.remove('in'); setTimeout(() => d.remove(), 220);
}

/* ---------- loading ---------- */
async function loadTrip(id, manual) {
  const entry = myTrips()[id];
  if (!entry) { location.hash = ''; return; }
  const fresh = S.tripId !== id;
  S.tripId = id;
  if (fresh) {
    S.open.clear(); S.day = null; S.wxPop = true; S.tab = store.get('tab', 'today');
    S.weather = store.get('wx:' + id, {});
    loadMe(id);
    const cached = store.get('data:' + id, null);
    if (cached) accept(cached);
    else document.getElementById('app').innerHTML = '<div class="gate"><p>Loading trip…</p></div>';
  }
  try {
    const j = await api({ trip: id, code: entry.code, fresh: manual ? 1 : '' });
    if (j.ok) {
      store.set('data:' + id, j);
      const t = myTrips(); if (t[id]) { t[id].summary = summaryFrom(id, j); saveTrips(t); }
      if (S.tripId === id) { accept(j, !fresh); if (manual) toast('Up to date'); loadWeather(manual); syncTicks(); }
    } else if (j.error === 'bad_passcode') {
      const t = myTrips(); delete t[id]; saveTrips(t); store.set('data:' + id, null);
      location.hash = ''; homeView('The passcode for that trip has changed. Ask Cody for the new one.');
    } else if (manual) toast('The sheet could not be read just now');
  } catch (e) { if (manual || !S.data) toast('No signal. Showing the saved copy.'); if (S.data) loadWeather(); }
}
function accept(data, keepScroll) {
  S.data = data; build(data);
  if (!S.day || !S.days.includes(S.day)) pickDefaultDay();
  render(keepScroll);
  askMeOnce();
}
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id && myTrips()[id]) loadTrip(id);
  else { S.tripId = null; S.data = null; homeView(); window.scrollTo(0, 0); }
}
function migrateOld() { // phones that opened the first version (/jeju) already have the Jeju passcode saved
  try {
    const code = JSON.parse(localStorage.getItem('tv:jeju-2026:code') || 'null');
    const data = JSON.parse(localStorage.getItem('tv:jeju-2026:data') || 'null');
    const t = myTrips();
    if (code && !t['jeju-2026']) { t['jeju-2026'] = { code, summary: data ? summaryFrom('jeju-2026', data) : { id: 'jeju-2026', tripName: 'Jeju' } }; saveTrips(t); if (data) store.set('data:jeju-2026', data); }
  } catch (e) {}
}
function boot() {
  if (store.get('big', false)) document.documentElement.classList.add('big');
  migrateOld();
  window.addEventListener('hashchange', route);
  window.addEventListener('online', () => flushTicks());
  route();
  setInterval(() => { if (S.data && S.tab === 'today') render(true); }, 60000); // keep Now/Next current
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.tripId) loadTrip(S.tripId); });
}
boot();
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
